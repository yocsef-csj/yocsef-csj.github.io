<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOCSEF CSJ — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-0: #05060a;
      --bg-1: #0b1020;
      --accent-1: #7c5cff;
      --accent-2: #00d4ff;
      --accent-3: #ff6b9d;
      --text: #e8eaf3;
      --text-dim: rgba(232, 234, 243, 0.62);
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg-0);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 动态渐变背景 */
    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(124, 92, 255, 0.35), transparent 60%),
        radial-gradient(ellipse 70% 50% at 80% 30%, rgba(0, 212, 255, 0.28), transparent 60%),
        radial-gradient(ellipse 60% 50% at 50% 90%, rgba(255, 107, 157, 0.22), transparent 60%),
        linear-gradient(135deg, #05060a 0%, #0b1020 100%);
      animation: bg-shift 18s ease-in-out infinite alternate;
    }

    @keyframes bg-shift {
      0%   { filter: hue-rotate(0deg) saturate(1); }
      100% { filter: hue-rotate(20deg) saturate(1.15); }
    }

    /* 噪点纹理 */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      mix-blend-mode: overlay;
    }

    /* 浮动光点 */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.6;
      pointer-events: none;
      animation: float 14s ease-in-out infinite;
    }
    .orb-1 { width: 380px; height: 380px; background: var(--accent-1); top: -100px; left: -120px; }
    .orb-2 { width: 320px; height: 320px; background: var(--accent-2); bottom: -120px; right: -100px; animation-delay: -7s; }
    .orb-3 { width: 260px; height: 260px; background: var(--accent-3); top: 50%; left: 60%; animation-delay: -3s; opacity: 0.35; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(40px, -30px) scale(1.08); }
      66%      { transform: translate(-30px, 30px) scale(0.96); }
    }

    /* 主容器 */
    .wrap {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.03);
      margin-bottom: 28px;
      opacity: 0;
      animation: fade-up 1s ease-out 0.2s forwards;
    }

    .badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(0.9); }
    }

    h1 {
      font-size: clamp(48px, 11vw, 144px);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.04em;
      background: linear-gradient(120deg, #ffffff 0%, #c6c0ff 35%, #8fe6ff 65%, #ffffff 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s linear infinite, fade-up 1s ease-out 0.4s backwards;
    }

    @keyframes shimmer {
      0%   { background-position: 0% 0; }
      100% { background-position: 200% 0; }
    }

    .zh {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(16px, 2.2vw, 22px);
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.3em;
      margin-top: 18px;
      opacity: 0;
      animation: fade-up 1s ease-out 0.7s forwards;
    }

    .tagline {
      max-width: 560px;
      margin-top: 28px;
      font-size: clamp(14px, 1.6vw, 17px);
      line-height: 1.6;
      color: var(--text-dim);
      opacity: 0;
      animation: fade-up 1s ease-out 0.9s forwards;
    }

    .divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      margin: 36px 0 28px;
      opacity: 0;
      animation: fade-up 1s ease-out 1.1s forwards;
    }

    .meta {
      display: flex;
      gap: 32px;
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      opacity: 0;
      animation: fade-up 1s ease-out 1.3s forwards;
    }

    .meta strong {
      display: block;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 底部署名 */
    footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.15em;
      z-index: 2;
      opacity: 0;
      animation: fade-up 1s ease-out 1.6s forwards;
    }

    footer a {
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    footer a:hover { color: var(--text); }

    @media (max-width: 540px) {
      .meta { flex-direction: column; gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grain"></div>

  <main class="wrap">
    <span class="badge"><span class="dot"></span>YOCSEF · CSJ</span>
    <h1>Coming&nbsp;Soon</h1>
    <p class="zh">敬 · 请 · 期 · 待</p>
    <p class="tagline">Our new home is on the way. We're crafting something worth the wait.</p>
    <div class="divider"></div>
    <div class="meta">
      <div><strong>YOCSEF CSJ</strong>Young Computer Scientists &amp; Engineers Forum</div>
      <div><strong>Status</strong>Under Construction</div>
    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> YOCSEF CSJ. All rights reserved.
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
