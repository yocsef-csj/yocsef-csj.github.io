<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <title>Embodied Intelligence White Paper · 具身智能白皮书</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-0: #05060a;
      --bg-1: #0b1020;
      --accent-1: #7c5cff;
      --accent-2: #00d4ff;
      --accent-3: #ff6b9d;
      --text: #e8eaf3;
      --text-dim: rgba(232, 234, 243, 0.62);
    }

    html, body {
      min-height: 100%;
      width: 100%;
      overflow-x: hidden;
      background: var(--bg-0);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    /* 动态渐变背景 */
    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(124, 92, 255, 0.35), transparent 60%),
        radial-gradient(ellipse 70% 50% at 80% 30%, rgba(0, 212, 255, 0.28), transparent 60%),
        radial-gradient(ellipse 60% 50% at 50% 90%, rgba(255, 107, 157, 0.22), transparent 60%),
        linear-gradient(135deg, #05060a 0%, #0b1020 100%);
      animation: bg-shift 18s ease-in-out infinite alternate;
    }

    @keyframes bg-shift {
      0%   { filter: hue-rotate(0deg) saturate(1); }
      100% { filter: hue-rotate(20deg) saturate(1.15); }
    }

    /* 噪点纹理 */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      mix-blend-mode: overlay;
    }

    /* 浮动光点 */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.6;
      pointer-events: none;
      animation: float 14s ease-in-out infinite;
    }
    .orb-1 { width: 380px; height: 380px; background: var(--accent-1); top: -100px; left: -120px; }
    .orb-2 { width: 320px; height: 320px; background: var(--accent-2); bottom: -120px; right: -100px; animation-delay: -7s; }
    .orb-3 { width: 260px; height: 260px; background: var(--accent-3); top: 50%; left: 60%; animation-delay: -3s; opacity: 0.35; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(40px, -30px) scale(1.08); }
      66%      { transform: translate(-30px, 30px) scale(0.96); }
    }

    /* 主容器 */
    .wrap {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(32px, env(safe-area-inset-top)) 32px max(96px, calc(env(safe-area-inset-bottom) + 88px));
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      max-width: calc(100vw - 48px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      font-size: clamp(10px, 1.4vw, 12px);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.03);
      margin-bottom: 28px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      animation: fade-up 1s ease-out 0.2s forwards;
    }

    .badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(0.9); }
    }

    h1 {
      font-size: clamp(48px, 11vw, 144px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.04em;
      padding-bottom: 0.08em;
      background: linear-gradient(120deg, #ffffff 0%, #c6c0ff 35%, #8fe6ff 65%, #ffffff 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s linear infinite, fade-up 1s ease-out 0.4s backwards;
    }

    @keyframes shimmer {
      0%   { background-position: 0% 0; }
      100% { background-position: 200% 0; }
    }

    .zh {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(18px, 2.6vw, 28px);
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.25em;
      margin-top: 22px;
      opacity: 0;
      animation: fade-up 1s ease-out 0.7s forwards;
    }

    .tagline {
      max-width: 640px;
      margin-top: 28px;
      font-size: clamp(14px, 1.6vw, 17px);
      line-height: 1.8;
      color: var(--text-dim);
      opacity: 0;
      animation: fade-up 1s ease-out 0.9s forwards;
    }

    .divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      margin: 36px 0 28px;
      opacity: 0;
      animation: fade-up 1s ease-out 1.1s forwards;
    }

    .orgs {
      text-align: center;
      opacity: 0;
      animation: fade-up 1s ease-out 1.3s forwards;
    }

    .orgs-label {
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 18px;
    }

    .orgs-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 720px;
    }

    .org {
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      transition: border-color 0.25s, background 0.25s, transform 0.25s;
    }

    .org:hover {
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 底部署名 */
    footer {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      padding: 0 16px;
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.15em;
      z-index: 2;
      opacity: 0;
      animation: fade-up 1s ease-out 1.6s forwards;
    }

    footer a {
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    footer a:hover { color: var(--text); }

    /* iPad 竖屏及以下 */
    @media (max-width: 900px) {
      .wrap { padding-left: 24px; padding-right: 24px; }
      .tagline { max-width: 92%; }
    }

    /* 手机 */
    @media (max-width: 600px) {
      .wrap {
        padding-top: max(20px, env(safe-area-inset-top));
        padding-left: 18px;
        padding-right: 18px;
        padding-bottom: max(88px, calc(env(safe-area-inset-bottom) + 80px));
      }
      .badge { letter-spacing: 0.15em; padding: 5px 12px; margin-bottom: 22px; }
      h1 { font-size: clamp(46px, 14vw, 88px); letter-spacing: -0.03em; }
      .zh { font-size: clamp(16px, 4.5vw, 22px); letter-spacing: 0.2em; margin-top: 18px; }
      .tagline { font-size: 14px; line-height: 1.7; margin-top: 22px; }
      .divider { margin: 28px 0 22px; }
      .orgs-label { font-size: 10px; letter-spacing: 0.28em; margin-bottom: 14px; }
      .orgs-list { gap: 8px; }
      .org { font-size: 12px; padding: 7px 13px; }
      footer { font-size: 10px; letter-spacing: 0.12em; }
      /* 移动端降低光斑滤镜强度,缓解低端机卡顿 */
      .orb { filter: blur(50px); opacity: 0.5; }
    }

    /* 超窄屏 */
    @media (max-width: 360px) {
      h1 { font-size: 42px; }
      .badge { font-size: 9.5px; }
      .org { font-size: 11.5px; padding: 6px 11px; }
    }

    /* 横屏 / 矮屏:让内容自然滚动,避免裁切 */
    @media (max-height: 620px) {
      .wrap {
        justify-content: flex-start;
        padding-top: 48px;
        padding-bottom: 96px;
      }
      footer { position: relative; bottom: auto; margin-top: 32px; padding-bottom: 16px; }
    }

    /* 用户偏好减少动效 */
    @media (prefers-reduced-motion: reduce) {
      .bg, .orb, h1, .dot { animation: none !important; }
      .badge, .zh, .tagline, .divider, .orgs, footer { animation-duration: 0.001s !important; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grain"></div>

  <main class="wrap">
    <span class="badge"><span class="dot"></span>Embodied Intelligence White Paper</span>
    <h1>Coming&nbsp;Soon</h1>
    <p class="zh">具身智能 · 白皮书</p>
    <p class="tagline">由 CCF YOCSEF 长三角五地联合发起,汇聚学界与产业界视角,共同绘制中国具身智能的发展图景。白皮书即将发布,敬请期待。</p>
    <div class="divider"></div>
    <div class="orgs">
      <div class="orgs-label">联合发起 · Jointly Initiated by</div>
      <div class="orgs-list">
        <span class="org">CCF YOCSEF 上海</span>
        <span class="org">CCF YOCSEF 杭州</span>
        <span class="org">CCF YOCSEF 合肥</span>
        <span class="org">CCF YOCSEF 南京</span>
        <span class="org">CCF YOCSEF 苏州</span>
      </div>
    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> CCF YOCSEF 长三角 · All rights reserved.
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
